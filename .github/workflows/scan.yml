name: scan
on:
  workflow_dispatch:
  # UN escaneo por job (~1-2 min). El cron esta APAGADO a proposito: para
  # activarlo, descomenta las dos lineas de abajo (y reactiva el workflow en
  # la pestana Actions si estaba desactivado). GitHub retrasa o salta algunas
  # ejecuciones a horas punta: la cadencia real sera de 10-20 min.
  # schedule:
  #   - cron: "*/10 * * * *"
# en cola, NUNCA cancelar: matar un escaneo a medias podia mandar un aviso de
# Telegram sin llegar a guardar el estado (y repetirlo en el siguiente)
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # opcional (estrategia A, cuotas de casas): clave de The Odds API
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1  # solo la ultima version: el estado vive en los JSON
      - name: escaneo
        run: python scanner.py
      - name: commit y push del estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          git commit -q -m "scan: actualiza signals.json"
          # si otro job (backtest) empujo entre medias: rebase y reintento
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::no se pudo hacer push del estado tras 3 intentos"
          exit 1
