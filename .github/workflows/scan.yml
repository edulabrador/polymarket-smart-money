name: scan
on:
  workflow_dispatch:
  schedule:
    # el cron solo relanza el bucle (GitHub lo estrangula sin problema);
    # la cadencia real de escaneo la marca SCAN_EVERY_MIN dentro del job
    - cron: "17 */3 * * *"
concurrency:
  group: scan
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCAN_EVERY_MIN: "5"
    steps:
      - uses: actions/checkout@v6
      - name: bucle de escaneo cada SCAN_EVERY_MIN min (~5h30; el cron lo relanza)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          start=$(date +%s)
          fails=0
          # bucle por TIEMPO, no por vueltas: un escaneo lento no alarga el job
          # mas alla del timeout ni desplaza la cadencia
          while [ $(( $(date +%s) - start )) -lt 19800 ]; do
            t0=$(date +%s)
            if python scanner.py; then
              fails=0
            else
              fails=$((fails+1))
              echo "fallo $fails/3"
              if [ $fails -ge 3 ]; then exit 1; fi
            fi
            git add docs/
            git commit -m "scan: actualiza signals.json" || true
            # un rebase que choca NO se puede dejar a medias: bloquearia todos
            # los commits siguientes sin que nadie se entere
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::warning::git pull --rebase fallo; se reintenta en la siguiente vuelta"
            fi
            git push || echo "::warning::git push fallo; se reintenta en la siguiente vuelta"
            espera=$(( SCAN_EVERY_MIN * 60 - ($(date +%s) - t0) ))
            if [ $espera -gt 0 ]; then sleep $espera; fi
          done
