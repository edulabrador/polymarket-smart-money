name: test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: tests sin red
        run: |
          python tests/test_scanner.py
          python tests/test_backtest.py
          python tests/test_main.py
          python tests/test_strategies.py
      # prueba en seco contra la API real (Actions no esta bloqueado): lee el
      # estado real, escribe en /tmp y no envia nada por Telegram
      - name: escaneo en seco contra Polymarket
        env:
          DRY_RUN: "1"
        run: python scanner.py
      - name: backtest en seco (replay + oraculo)
        env:
          DRY_RUN: "1"
        run: python backtest.py
